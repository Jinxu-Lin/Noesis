<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Noesis 系统总览</title>
  <desc id="desc">Noesis 的整体介绍图，包含核心定位、关键指标、Logos、Episteme、Praxis 与 Evolution 四个部分。</desc>
  <style>
    .bg { fill: #f3f0ea; }
    .window { fill: #fbfaf6; stroke: #ddd7cb; stroke-width: 2; }
    .bar { fill: #f1ede6; stroke: #ddd7cb; stroke-width: 2; }
    .card { fill: #fffdf9; stroke: #ddd7cb; stroke-width: 2; }
    .muted { fill: #667085; font: 500 24px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .title { fill: #0f1728; font: 700 78px Georgia, "Times New Roman", serif; }
    .headline { fill: #0f1728; font: 700 36px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .subhead { fill: #344054; font: 600 28px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .body { fill: #475467; font: 500 22px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .small { fill: #667085; font: 500 18px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .metric { fill: #101828; font: 700 62px Georgia, "Times New Roman", serif; }
    .metricLabel { fill: #344054; font: 600 24px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .chipText { font: 600 18px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .badgeText { fill: #3b5ccc; font: 700 24px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .footer { fill: #1f2937; font: 700 26px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  </style>

  <rect class="bg" x="0" y="0" width="1600" height="1080" rx="32"/>
  <rect class="window" x="36" y="26" width="1528" height="1028" rx="28"/>
  <rect class="bar" x="36" y="26" width="1528" height="68" rx="28"/>
  <rect class="bar" x="36" y="66" width="1528" height="28" rx="0"/>
  <circle cx="76" cy="60" r="8" fill="#ff5f57"/>
  <circle cx="102" cy="60" r="8" fill="#febc2e"/>
  <circle cx="128" cy="60" r="8" fill="#28c840"/>
  <text x="1490" y="64" text-anchor="end" class="muted">1 / 4</text>

  <rect x="560" y="122" width="480" height="64" rx="32" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="800" y="163" text-anchor="middle" class="badgeText">AI 研究操作系统</text>

  <text x="800" y="276" text-anchor="middle" class="title">Noesis</text>
  <text x="800" y="336" text-anchor="middle" class="muted">让知识积累、研究判断、实验执行与论文写作进入同一套可持续进化的系统</text>

  <rect class="card" x="100" y="396" width="316" height="132" rx="24"/>
  <rect class="card" x="442" y="396" width="316" height="132" rx="24"/>
  <rect class="card" x="784" y="396" width="316" height="132" rx="24"/>
  <rect class="card" x="1126" y="396" width="316" height="132" rx="24"/>

  <text x="132" y="468" class="metric" fill="#4f6bda">2</text>
  <text x="240" y="455" class="metricLabel">独立子系统</text>
  <text x="240" y="492" class="small">Logos 与 Praxis 解耦运行</text>

  <text x="474" y="468" class="metric" fill="#219d6a">15</text>
  <text x="582" y="455" class="metricLabel">自动化阶段</text>
  <text x="582" y="492" class="small">R1-R8 与 P1-P7 覆盖</text>

  <text x="816" y="468" class="metric" fill="#8e51d7">9</text>
  <text x="924" y="455" class="metricLabel">命令入口</text>
  <text x="924" y="492" class="small">从 discover 到 evolve</text>

  <text x="1158" y="468" class="metric" fill="#c77b11">&#8734;</text>
  <text x="1266" y="455" class="metricLabel">跨项目复利</text>
  <text x="1266" y="492" class="small">lessons 自动注入后续项目</text>

  <rect class="card" x="100" y="572" width="670" height="186" rx="28"/>
  <rect class="card" x="830" y="572" width="670" height="186" rx="28"/>
  <rect class="card" x="100" y="788" width="670" height="186" rx="28"/>
  <rect class="card" x="830" y="788" width="670" height="186" rx="28"/>

  <text x="132" y="634" class="headline">Logos</text>
  <text x="132" y="671" class="subhead">持续知识积累引擎</text>
  <text x="132" y="708" class="body">发现论文、深度阅读、提取结构化知识资产，持续填充 Episteme。</text>
  <rect x="132" y="724" width="174" height="34" rx="17" fill="#eef2ff"/>
  <text x="219" y="747" text-anchor="middle" class="chipText" fill="#3b5ccc">/logos-discover</text>
  <rect x="320" y="724" width="132" height="34" rx="17" fill="#eef2ff"/>
  <text x="386" y="747" text-anchor="middle" class="chipText" fill="#3b5ccc">/logos-read</text>

  <text x="862" y="634" class="headline">Episteme</text>
  <text x="862" y="671" class="subhead">系统知识库</text>
  <text x="862" y="708" class="body">Methods、Gaps、Patterns 与 Reusable Resources 的统一存储层。</text>
  <rect x="862" y="724" width="150" height="34" rx="17" fill="#e8f7ef"/>
  <text x="937" y="747" text-anchor="middle" class="chipText" fill="#248f5b">Methods Bank</text>
  <rect x="1024" y="724" width="182" height="34" rx="17" fill="#f4ebff"/>
  <text x="1115" y="747" text-anchor="middle" class="chipText" fill="#7a35c1">Gaps &amp; Assumptions</text>
  <rect x="1218" y="724" width="214" height="34" rx="17" fill="#fff2e2"/>
  <text x="1325" y="747" text-anchor="middle" class="chipText" fill="#b36b00">Experimental Patterns</text>

  <text x="132" y="850" class="headline">Praxis</text>
  <text x="132" y="887" class="subhead">研究执行引擎</text>
  <text x="132" y="924" class="body">Startup、Research、Code、Paper、Evolution 五大模块驱动项目生命周期。</text>
  <rect x="132" y="940" width="152" height="34" rx="17" fill="#eef2ff"/>
  <text x="208" y="963" text-anchor="middle" class="chipText" fill="#3b5ccc">/praxis-start</text>
  <rect x="298" y="940" width="178" height="34" rx="17" fill="#eef2ff"/>
  <text x="387" y="963" text-anchor="middle" class="chipText" fill="#3b5ccc">/praxis-research</text>
  <rect x="490" y="940" width="150" height="34" rx="17" fill="#eef2ff"/>
  <text x="565" y="963" text-anchor="middle" class="chipText" fill="#3b5ccc">/praxis-paper</text>

  <text x="862" y="850" class="headline">Evolution Overlay</text>
  <text x="862" y="887" class="subhead">经验回流层</text>
  <text x="862" y="924" class="body">lessons 与 pipeline-evolution-log 将项目经验反馈给后续项目和框架本身。</text>
  <rect x="862" y="940" width="162" height="34" rx="17" fill="#f4ebff"/>
  <text x="943" y="963" text-anchor="middle" class="chipText" fill="#7a35c1">~/.noesis/lessons</text>
  <rect x="1038" y="940" width="168" height="34" rx="17" fill="#f4ebff"/>
  <text x="1122" y="963" text-anchor="middle" class="chipText" fill="#7a35c1">/praxis-evolve</text>

  <path d="M 232 1010 H 1368" fill="none" stroke="#d6d1c4" stroke-width="2"/>
  <text x="800" y="1036" text-anchor="middle" class="footer">Logos → Episteme → Praxis → Lessons</text>
</svg>
