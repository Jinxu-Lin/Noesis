# Method Review Configuration (Phase 5)
# 被 /review method 加载

review_type: Method Review
phase_id: 5
phase_name: "Method Review (方法审查)"

# SubAgent 需要读取的文档
input_docs:
  required:
    - gap-analysis.md
    - method-design.md
    - contribution.md
  optional: []

# 审查报告输出文件名
output_doc: method-review.md

# 审查维度
review_dimensions:
  - name: 逻辑闭环
    question: "Gap→根因→方法→为什么解决，链条是否完整？"
    criteria: "每一环都能严格推导，无逻辑跳跃"

  - name: 组件必要性
    question: "每个组件是否不可或缺？去掉任何一个会怎样？"
    criteria: "每个组件都有明确的必要性论证"

  - name: 理论正确性
    question: "数学推导是否正确？假设是否合理？"
    criteria: "公式推导无误，假设被明确声明"

  - name: 差异化
    question: "与最相近现有方法的本质区别是什么？"
    criteria: "差异必须是实质性的，非 trivial 变体"

  - name: 可实现性
    question: "方法是否可以被实现和验证？"
    criteria: "无需不现实的计算资源或数据"

  - name: 贡献充分性
    question: "contribution.md 中的贡献是否足够支撑发表？"
    criteria: "novelty + significance 达标"

# 判定后的路由
routing:
  pass:
    next_skill: "/experiment-design"
    message: "Method Review 通过，建议进入 /experiment-design 设计实验。"

  revise:
    next_skill: "/method-design"
    message: "方法需要修改，请进入 /method-design 进行迭代（method-review.md 将作为迭代输入）。"

  block:
    continue_skill: "/gap-discovery"
    continue_message: "方法路线需根本性调整，建议返回 /gap-discovery 重新审视 Gap。"
    abandon_message: "Exit Assessment Gate 判定 Abandon，建议进入 /retrospective 进行项目回顾。"
