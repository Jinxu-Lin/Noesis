# Experiment Review Configuration (Phase 7)
# 被 /review experiment 加载

review_type: Experiment Review
phase_id: 7
phase_name: "Experiment Review (实验设计审查)"

# SubAgent 需要读取的文档
input_docs:
  required:
    - gap-analysis.md
    - method-design.md
    - experiment-design.md
    - contribution.md
  optional: []

# 审查报告输出文件名
output_doc: experiment-review.md

# 审查维度
review_dimensions:
  - name: RQ 覆盖率
    question: "是否每个 claim 都有实验支撑？"
    criteria: "无遗漏的 claim-experiment 映射"

  - name: Baseline 公平性
    question: "对比方法是否是当前最强？设置是否公平？"
    criteria: "不能只挑弱 baseline 比"

  - name: 消融充分性
    question: "是否能区分各组件的贡献？"
    criteria: "每个组件的必要性都可被验证"

  - name: Metrics 合理性
    question: "指标是否真的衡量了想衡量的东西？"
    criteria: "指标与 RQ 的语义对应关系"

  - name: 快速验证合理性
    question: "Dimension 0 的通过标准是否合理？"
    criteria: "标准不能太松也不能太严"

  - name: 可复现性
    question: "实验描述是否足够详细以复现？"
    criteria: "数据集、超参数、随机种子等"

  - name: 审稿人预判
    question: "审稿人最可能要求的额外实验？"
    criteria: "提前识别可能的 weakness"

# 判定后的路由
routing:
  pass:
    next_skill: "/impl-setup"
    message: "Experiment Review 通过，建议进入 /impl-setup 开始代码实现。"

  revise:
    next_skill: "/experiment-design"
    message: "实验设计需要修改，请进入 /experiment-design 进行迭代（experiment-review.md 将作为迭代输入）。"

  block:
    continue_skill: "/method-design"
    continue_message: "实验设计的根本问题可能源于方法设计，建议返回 /method-design 重新审视。"
    abandon_message: "Exit Assessment Gate 判定 Abandon，建议进入 /retrospective 进行项目回顾。"
