# Gap Review Configuration (Phase 3)
# 被 /review gap 加载

review_type: Gap Review
phase_id: 3
phase_name: "Gap Review (研究空白审查)"

# ── 新增：多视角机制开关（借鉴 Sibyl System）────────────────────────────
# 挑战者 SubAgent：专职寻找 Block 级问题（P3 不启用，单审查者已足够）
challenger_enabled: false

# 竞争工作在线核查：搜索近期是否有人已解决该 Gap（P3 的新颖性验证需要此步骤）
comparativist_search: true
comparativist_search_hint: >
  重点搜索：该 Gap 是否已有解决方案？搜索关键词应来自 gap-analysis.md 的研究问题。
  搜索范围：arxiv 2024-2025，重点关注和本 RQ 解决同一问题的工作。
# ───────────────────────────────────────────────────────────────────────

# SubAgent 需要读取的文档
input_docs:
  required:
    - gap-analysis.md
    - contribution.md
  optional:
    - project-startup.md  # 供参考背景（含 P1 三帽检验结果和初始假设清单）

# 审查报告输出文件名
output_doc: gap-review.md

# 审查维度
review_dimensions:
  - name: 真实性
    question: "这真的是一个未解决的 gap，还是 pseudo-gap？"
    criteria: "需要引用具体证据说明无人解决"

  - name: 重要性
    question: "解决这个 gap 对领域有多大影响？"
    criteria: "影响范围是否足够支撑一篇论文"

  - name: 新颖性（含竞争工作核查）
    question: "是否有其他团队正在做类似工作？在线核查结果是否改变了新颖性判断？"
    criteria: >
      主审查 SubAgent 需结合 comparativist_search 的在线核查结果做出判定。
      如发现直接竞争工作，必须分析本项目与之的实质差异。
      如无竞争工作，记录搜索范围并说明新颖性成立的依据。

  - name: 根因深度
    question: "根因分析是否到位？是否还能再追问一层？"
    criteria: "根因应直接指向方法设计方向"

  - name: RQ 可回答性与可证伪性
    question: "RQ 是否可以被实验验证？是否存在明确的否证条件？"
    criteria: >
      不仅需要有验证路径，还需要有否证条件（"什么实验结果会否定该 RQ"）。
      参考 project-startup.md Section 4.1 中的否证条件（如有）。

  - name: 假设自洽性（新增）
    question: "Gap Discovery 的论证是否与 project-startup.md 中的初始假设一致？是否有隐含假设未被显性化？"
    criteria: >
      借鉴 Revisionist 视角：回顾 project-startup.md 的假设清单（如有），
      检查 gap-analysis.md 是否在不知不觉中引入了新的未声明假设。
      如有新假设，需评估其合理性；如有假设被悄悄放弃，需指出。

  - name: 贡献价值
    question: "当前可见的贡献是否足够支撑发表？"
    criteria: "审查 contribution.md 的初始条目"

# 战略预判引导（提示主审查 SubAgent 的战略预判方向）
strategic_foresight_hint: >
  在战略预判中，重点回答：
  如果 Gap 成立但后续方法设计发现技术上无法解决，最合理的 Gap 重新框架是什么？
  竞争工作核查中发现的相似工作，是否提示了一个"差异化 pivot"方向？

# 判定后的路由
routing:
  pass:
    next_skill: "/method-design"
    message: "Gap Review 通过，建议进入 /method-design 设计方法。"

  revise:
    next_skill: "/gap-discovery"
    message: "Gap 需要修改，请进入 /gap-discovery 进行迭代（gap-review.md 将作为迭代输入）。"

  block:
    continue_skill: "/project-startup"
    continue_message: "Gap 方向需重大调整，建议返回 /project-startup 重新选题。"
    abandon_message: "Exit Assessment Gate 判定 Abandon，建议进入 /retrospective 进行项目回顾。"
