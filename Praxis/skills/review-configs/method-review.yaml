# Method Review Configuration (Phase 5)
# 被 /review method 加载

review_type: Method Review
phase_id: 5
phase_name: "Method Review (方法审查)"

# ── 新增：多视角机制开关（借鉴 Sibyl System）────────────────────────────
# 挑战者 SubAgent：P5 可选启用（当方法较复杂或第 2+ 次 Revise 迭代时建议开启）
challenger_enabled: false  # 默认关闭；若方法设计迭代超过 2 次，建议手动改为 true

# 竞争工作核查：P5 不需要（P3 已做；方法差异化在现有维度中覆盖）
comparativist_search: false
# ───────────────────────────────────────────────────────────────────────

# SubAgent 需要读取的文档
input_docs:
  required:
    - gap-analysis.md
    - method-design.md
    - contribution.md
  optional:
    - project-startup.md  # 供验证假设链一致性（含 P1 三帽检验）

# 审查报告输出文件名
output_doc: method-review.md

# 审查维度
review_dimensions:
  - name: 逻辑闭环
    question: "Gap→根因→方法→为什么解决，链条是否完整？"
    criteria: "每一环都能严格推导，无逻辑跳跃"

  - name: 组件必要性
    question: "每个组件是否不可或缺？去掉任何一个会怎样？"
    criteria: "每个组件都有明确的必要性论证"

  - name: 理论正确性
    question: "数学推导是否正确？假设是否合理？"
    criteria: "公式推导无误，假设被明确声明"

  - name: 差异化
    question: "与最相近现有方法的本质区别是什么？"
    criteria: "差异必须是实质性的，非 trivial 变体"

  - name: 可实现性
    question: "方法是否可以被实现和验证？"
    criteria: "无需不现实的计算资源或数据"

  - name: 可评估性预判（新增，借鉴 Methodologist 视角）
    question: "这个方法是否可以被公正地实验评估？评估协议是否会产生有利于该方法的系统性偏差？"
    criteria: >
      Methodologist 核心追问：
      1. 该方法提出的评估指标是否真的测量了声称要测量的东西？
      2. 实验设计（P6/P7 将要做的）是否存在使该方法看起来更好的结构性优势？
         （例如：方法本身就针对特定 benchmark 优化了，与方法无关）
      3. 是否存在"方法成功但无法区分是方法本身 work 还是 trick work"的风险？
      这个维度评估的是"P6 能否设计出公正的实验"，而非方法本身正确性。

  - name: 假设链一致性（新增，借鉴 Revisionist 视角）
    question: "方法设计的前提假设是否与 gap-analysis.md 的根因分析一致？是否存在隐性假设漂移？"
    criteria: >
      Revisionist 核心追问：方法设计是否在解决 gap-analysis.md 中定义的同一个问题？
      有时候方法设计过程中会不知不觉地"换了一个更容易解决的问题"。
      如有，需指出漂移点并评估严重性（Revise vs Block）。

  - name: 贡献充分性
    question: "contribution.md 中的贡献是否足够支撑发表？"
    criteria: "novelty + significance 达标"

# 战略预判引导
strategic_foresight_hint: >
  在战略预判中，重点回答：
  1. 如果 P8 实验结果不达标，最可能的原因是方法的哪个组件出问题？
  2. 如果需要 L2 Swap，最自然的替代组件是什么？
  3. 如果可评估性预判发现存在系统性偏差风险，在 P6 实验设计中应如何预防？

# 判定后的路由
routing:
  pass:
    next_skill: "/experiment-design"
    message: "Method Review 通过，建议进入 /experiment-design 设计实验。"

  revise:
    next_skill: "/method-design"
    message: "方法需要修改，请进入 /method-design 进行迭代（method-review.md 将作为迭代输入）。"

  block:
    continue_skill: "/gap-discovery"
    continue_message: "方法路线需根本性调整，建议返回 /gap-discovery 重新审视 Gap。"
    abandon_message: "Exit Assessment Gate 判定 Abandon，建议进入 /retrospective 进行项目回顾。"
