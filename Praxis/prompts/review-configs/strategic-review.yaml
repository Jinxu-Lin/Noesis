# Strategic Review Configuration (Phase RS)
# 战略审查：审查方向+攻击角度+探针可行性
# 以顶会 AC 视角审查研究方向的战略价值

review_type: Strategic Review
phase_id: RS
phase_name: "Strategic Review (战略审查)"

# ── 多视角辩论配置 ──────────────────────────────────────────────────────
# RS 辩论焦点：方向判断、新颖性、探针可行性、跨域替代
debate_agents:
  - contrarian        # 构建最强反驳：Gap 真实性、攻击角度致命缺陷
  - comparativist     # 文献对照 + 在线搜索：Gap 新颖性、近期竞争工作
  - pragmatist        # 可行性约束：探针可执行性、资源约束、时间预算合理性
  - interdisciplinary # 跨领域视角：其他领域的更好问题框定、替代攻击角度

debate_output_subdir: RS   # phase-outcomes/debate/RS/
# ───────────────────────────────────────────────────────────────────────

# SubAgent 需要读取的文档
input_docs:
  required:
    - research/problem-statement.md
    - research/contribution.md
  optional:
    - project-startup.md  # 供参考背景（含辩论结论和候选攻击角度）

# 审查报告输出文件名
output_doc: inner-reviews/strategic-review.md

# 审查维度（7 项）— 每项含明确评分标准和常见陷阱
review_dimensions:
  - name: Gap 真实性
    question: "这真的是一个未解决的 gap，还是伪问题？"
    criteria: >
      需要引用具体证据说明无人解决。
      检查清单：
      (1) Gap 是否有实证支撑（实验数据/failure cases），而非纯理论推测？
      (2) 是否存在已有方法的 minor modification 就能解决的可能？
      (3) Gap 是否是技术限制的自然结果（如 transformer 的 O(n²) 复杂度），而非一个需要"解决"的问题？
      常见陷阱：把已解决的问题重新包装为"未解决"；把领域公认的 trade-off 当作 gap。
    scoring_guide: >
      Pass: Gap 有明确实证，无已知解决方案，且不是已知 trade-off 的重述。
      Revise: Gap 存在但证据不充分，或需要更精确地区分与已有工作的差异。
      Block: Gap 已被解决或是伪问题。

  - name: Gap 重要性与贡献天花板
    question: "解决这个 gap 对领域的影响有多大？即使完美解决，能发到什么级别？"
    criteria: >
      影响力是否足以支撑一篇论文。
      检查清单：
      (1) 受影响的 downstream tasks 有多少？影响面是窄（单一任务）还是广（整个子领域）？
      (2) 解决此 gap 带来的性能提升预期：是 marginal (1-2%) 还是 substantial (5%+)?
      (3) 即使方法完美 work，最高能发到什么 venue？是 oral 潜力还是 borderline poster？
      (4) 是否存在"ceiling effect"——即使完美解决，提升空间也很有限？
      常见陷阱："Incremental improvement" 是顶会最常见的 reject 原因之一。
    scoring_guide: >
      Pass: 解决此 gap 可产生 substantial 影响，天花板为 top venue poster 或以上。
      Revise: 影响面有限，需要扩大 scope 或重新框定贡献。
      Block: 贡献天花板明显低于目标 venue 要求。

  - name: Gap 新颖性 + 竞争态势
    question: "近期有无竞争工作？竞争窗口有多大？"
    criteria: >
      结合 comparativist 的在线核查结果做出判定。
      检查清单：
      (1) arXiv 近 6 个月是否有直接竞争工作？如有，差异化是否足够？
      (2) 大组（Google/Meta/DeepMind/OpenAI）是否在相关方向发力？小组如何差异化？
      (3) 竞争窗口估计：是 3 个月（紧急）还是 12 个月（从容）？
      (4) Concurrent submission 风险：同一 deadline 是否可能有相似工作提交？
      (5) 方向热度趋势：上升期（好，有关注度）vs 饱和期（难出新意）vs 衰退期（无人关注）。
      常见陷阱：低估竞争——很多工作在 arXiv 出现前就在内部开发；高估差异化——minor 差异不够。
    scoring_guide: >
      Pass: 无直接竞争或有明确差异化策略，竞争窗口 >= 6 个月。
      Revise: 存在部分竞争但差异化方向清晰，需要在 problem-statement 中明确 positioning。
      Block: 已有高度相似工作，或大组已发布解决方案，差异化空间不足。

  - name: Root Cause 深度
    question: "根因分析是否到位？是否还能再追问一层？"
    criteria: >
      根因应直接指向攻击角度的选择。
      检查清单：
      (1) Root cause 是否停留在症状层面（"性能差"）而非原因层面（"为什么性能差"）？
      (2) 是否可以追问 "why?" 至少两次而不到达 trivial 或已知结论？
      (3) Root cause 是否有实验验证（如 diagnostic experiments、visualization、ablation 暗示）？
      (4) Root cause 与攻击角度的因果关系是否严格？还是仅有相关性？
      常见陷阱：root cause 太浅（"现有方法不够好"不是 root cause）；root cause 是 post-hoc rationalization。
    scoring_guide: >
      Pass: Root cause 有实验依据，因果链清晰，直接导向攻击角度选择。
      Revise: Root cause 方向正确但分析不够深入，或缺乏实证支撑。
      Block: Root cause 是症状描述或 post-hoc rationalization。

  - name: 攻击角度可信度
    question: "这个攻击思路在直觉上有没有可能 work？与 root cause 匹配吗？"
    criteria: >
      攻击角度必须与 root cause 类型逻辑一致。
      检查清单：
      (1) 攻击角度是否直接针对 root cause？（而非绕过 root cause 的 workaround）
      (2) 是否有先验理由相信这个方向 work？（理论依据 / 类比 / 探针初步结果）
      (3) 攻击角度是否过于复杂？DL 领域的经验法则：simple methods that work > complex methods that might work。
      (4) 是否存在已知的 failure mode 使得此攻击角度注定失败？
      (5) 攻击角度的 novelty：是全新思路还是已有方法的 minor adaptation？
      常见陷阱：攻击角度是"我会的方法"而非"最适合这个问题的方法"（hammer-nail 问题）。
    scoring_guide: >
      Pass: 攻击角度直接匹配 root cause，有先验支撑，novelty 充分。
      Revise: 匹配但支撑不足，或 novelty 需要更清晰的论证。
      Block: 攻击角度与 root cause 不匹配，或存在已知 failure mode。

  - name: 探针方案合理性
    question: "Dim 0 能否有效验证核心假设？pass 标准合理吗？"
    criteria: >
      标准不能太松（通过了但后续必定失败）也不能太严（几乎不可能通过）。
      检查清单：
      (1) 探针实验是否测试的是核心假设而非边缘假设？
      (2) 探针的 setting 与完整实验的 setting 差距有多大？差距太大会导致 false positive。
      (3) pass/fail 标准是否有定量阈值？模糊标准（"有一些改进"）不可接受。
      (4) 时间预算是否为小时级？超过 1 天的探针违反最小成本原则。
      (5) 探针失败时，是否有明确的 pivot 方案？
      (6) 探针结果是否可能有多种解释？如何排除 confounding？
      常见陷阱：探针太简单（通过了也说明不了什么）；探针的 positive result 可以被更简单的解释覆盖。
    scoring_guide: >
      Pass: 探针直接验证核心假设，标准定量且合理，时间预算 <= 1 天。
      Revise: 探针方向正确但标准需要更严格/具体，或缺少 confounding 排除。
      Block: 探针不测试核心假设，或通过/失败都无法提供决策信息。

  - name: RQ 可回答性与可证伪性
    question: "RQ 是否可以被实验验证？是否存在明确的否证条件？"
    criteria: >
      不仅需要有验证路径，还需要有否证条件。
      检查清单：
      (1) RQ 是否足够具体到可以设计实验？（"我们的方法是否优于 X" vs "深度学习是否有效"）
      (2) 否证条件是否明确？什么结果会让作者放弃这个方向？
      (3) RQ 的回答是否有独立价值？即使方法不 work，实验结果是否能为领域提供 insight？
      (4) RQ 是否存在 tautology 风险（定义上就成立，无法被证伪）？
      常见陷阱：RQ 太 vague（"能否改进性能？"——改进多少算改进？）；否证条件缺失（永远可以说"再 tune 一下就好了"）。
    scoring_guide: >
      Pass: RQ 具体、可实验验证、有明确否证条件、失败也有信息价值。
      Revise: RQ 方向正确但需要更具体的否证条件或成功标准。
      Block: RQ 不可证伪或 tautologically true。

# 风险-回报评估引导（融入综合判定）
risk_reward_hint: >
  在最终判定中，显式评估风险-回报比：
  - 成功概率估计（基于方向难度、攻击角度可信度、探针方案可行性）
  - 成功时的影响力（基于 Gap 重要性、贡献天花板）
  - 高风险高回报 = 可接受（但需要探针快速验证）
  - 高风险低回报 = 不可接受（Block）
  - 低风险低回报 = 不值得做（Revise，要求提升贡献天花板）

# 战略预判引导
strategic_foresight_hint: >
  在战略预判中，重点回答：
  1. 如果探针失败，最可能的原因是什么？
  2. 如果需要换攻击角度，还有什么备选？
  3. 竞争工作核查中发现的相似工作，是否提示了一个"差异化 pivot"方向？
  4. 此方向最大的 "unknown unknown" 是什么？
  5. 6 个月后回头看，这个方向最可能的 regret 是什么？

# 判定后的路由
routing:
  pass:
    next_phase: "P"
    message: "战略审查通过，进入探针实验（P）验证核心直觉。"

  revise:
    next_phase: "C"
    message: "需要修改，回到问题锐化（C）。strategic-review.md 将作为迭代输入。"

  block:
    continue_phase: "C"
    continue_message: "方向需重大调整，返回问题锐化（C）重新设计。"
    abandon_message: "Exit Assessment Gate 判定 Abandon，进入知识回收（R）。"
